name: CLI Binary Release
'on':
  push:
    branches:
      - main
    paths:
      - cli/package.json
permissions:
  contents: read
jobs:
  check:
    name: Check Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: check
        run: |
          VERSION=$(node -p "require('./cli/package.json').version")
          if git ls-remote --tags origin "refs/tags/cli-v$VERSION" | grep -q .; then
            echo "cli-v$VERSION already released"
          else
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi
  release:
    name: Build & Release
    needs: check
    if: needs.check.outputs.version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10.34.7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install ldid (ad-hoc code signing for cross-compiled darwin binaries)
        run: |
          curl -fsSL -o /usr/local/bin/ldid https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
          echo '4b8862b2fefa2cd7fa8f88cb0310779619aeaa8c72d6aff22f019b470f2fa99a  /usr/local/bin/ldid' | sha256sum --check
          chmod +x /usr/local/bin/ldid
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Sign darwin binaries
        run: |
          ldid -S dist-bin/pub-darwin-arm64
          ldid -S dist-bin/pub-darwin-x64
      - name: Smoke test the native CLI binary
        run: node scripts/smoke-binary.mjs dist-bin/pub-linux-x64
      - name: Tag and release
        run: |
          git tag "cli-v${{ needs.check.outputs.version }}"
          git push origin "cli-v${{ needs.check.outputs.version }}"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: cli-v${{ needs.check.outputs.version }}
          files: cli/dist-bin/pub-*
          generate_release_notes: true
          draft: true
          make_latest: false
      - name: Publish the complete immutable CLI release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: cli-v${{ needs.check.outputs.version }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
