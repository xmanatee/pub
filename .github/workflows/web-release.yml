name: Web release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  release:
    permissions:
      contents: write
      packages: write
    uses: xmanatee/workflows/.github/workflows/publish-static.yml@242a883eb94e6538dd4999de0ca3e648997a8055
    with:
      publisher-ref: 242a883eb94e6538dd4999de0ca3e648997a8055
