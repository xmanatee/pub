name: Web release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  release:
    permissions:
      contents: write
      packages: write
    uses: xmanatee/workflows/.github/workflows/publish-static.yml@f5f07652d25f92f8fe7c03d1e026eb86a592ed62
    with:
      publisher-ref: f5f07652d25f92f8fe7c03d1e026eb86a592ed62
