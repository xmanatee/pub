name: Web release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    permissions:
      contents: write
      packages: write
    uses: xmanatee/workflows/.github/workflows/publish-static.yml@c45f6aca7e8b0f2c7cf4e22fcf59bfe1290f8e0a
    with:
      publisher-ref: c45f6aca7e8b0f2c7cf4e22fcf59bfe1290f8e0a
