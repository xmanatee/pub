name: Web release
on:
  push:
    branches: [main]
  schedule:
    - cron: "27 5 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    permissions:
      contents: write
      packages: write
    uses: xmanatee/workflows/.github/workflows/publish-static.yml@a1373e5b1da6117f7ecef55fc6ff1e7522239b80
    with:
      publisher-ref: a1373e5b1da6117f7ecef55fc6ff1e7522239b80
