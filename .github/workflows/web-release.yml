name: Web release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    permissions:
      contents: write
      packages: write
    uses: xmanatee/workflows/.github/workflows/publish-static.yml@697f658a52c4449c43b3ea8aed9a979674494e71
    with:
      publisher-ref: a7e68d5ca8db7ce350307d076a8de671ac6863fa
