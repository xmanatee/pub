events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Cache-Control no-cache always;
        location / { try_files $uri $uri/ /index.html; }
        location /assets/ { try_files $uri =404; }
    }
    server {
        listen 80;
        server_name sandbox.pub.blue;
        root /usr/share/nginx/html/sandbox;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "frame-ancestors https://pub.blue" always;
        add_header Cache-Control no-cache always;
        add_header Service-Worker-Allowed / always;
        location /__canvas__/ { try_files /index.html =404; }
        location = /sw.js { try_files $uri =404; }
        location / { return 404; }
    }
}
