packages:
  - web
  - cli
  - relay
  - packages/ip-compat
  - packages/super-app

overrides:
  # The MCP SDK accepts Hono 4.x; hold its patched request-validation release.
  "hono@<4.13.11": 4.13.11
  # The tracing SDK has not declared compatibility with the new API minor yet.
  "@opentelemetry/api": 1.9.0
  # Wrangler's bundled Miniflare still pins an undici release with fixed advisories.
  "undici@>=7.0.0 <7.30.1": 7.30.1
  dompurify: 3.4.9
  esbuild: 0.28.1
  ip: workspace:3.0.0-pub.0
  valibot: ^1.4.1
  ws: 8.21.0

minimumReleaseAge: 10080

auditConfig:
  ignoreGhsas:
    - GHSA-6cpc-mj5c-m9rq

strictDepBuilds: true

allowBuilds:
  esbuild: true
  protobufjs: true
  sharp: true
  workerd: true
  bufferutil: false
  core-js: false
  es5-ext: false
  utf-8-validate: false
